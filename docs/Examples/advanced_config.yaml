mode: yolo_pose

instance_types:
# Automatic bounding box (the default when `bounding_box` is omitted is actually
# "manual" - shown explicitly here for contrast with the mouse instance type below).
# Keypoints with no explicit color are auto-assigned one, evenly spaced by hue.
- name: epm
  bounding_box: automatic
  keypoints:
  - open_arm_1
  - open_arm_2
  - closed_arm_1
  - closed_arm_2
  - center

# Manual bounding box, explicit colors on the instance type, each keypoint, and the
# skeleton.
- name: mouse
  bounding_box: manual
  color: "#0000ff"
  keypoints:
  - name: nose
    color: "#00ff4c"
  - name: headcentre
    color: "#00ff4c"
  - name: neck
    color: "#00ff4c"
  - name: earl
    color: "#0000ff"
  - name: earr
    color: "#ff0000"
  - name: bodycentre
    color: "#00ff4c"
  - name: tailbase
    color: "#00ff4c"
  - name: tailtip
    color: "#00ff4c"
  skeleton:
    color: "#999999"
    lines:
    - [nose, headcentre]
    - [nose, earl]
    - [nose, earr]
    - [earl, neck]
    - [earr, neck]
    - [headcentre, neck]
    - [neck, bodycentre]
    - [bodycentre, tailbase]
    - [tailbase, tailtip]

# Expected instances per image, in order - drives the Labeller's automatic instance
# type selection while placing instances. The same type can be listed more than once.
instances:
- epm
- mouse
